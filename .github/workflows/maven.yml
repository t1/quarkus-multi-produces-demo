name: Java CI

on:
  push:
  pull_request:
  schedule: [ cron: '11 12 * * 5' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 24
          cache: 'maven'

      - run: mvn --batch-mode --show-version --no-transfer-progress -DCI=GitHub install
